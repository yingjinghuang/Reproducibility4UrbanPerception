name: perception_stable
channels:
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - -r requirements.txt
# Notes:
# - requirements.txt records the full CUDA 12.8 environment used for training.
# - The PyTorch CUDA wheels require the PyTorch package index; see README.md.
# Reproduce:
#   conda env create -f environment.yml
#   conda activate perception_stable
